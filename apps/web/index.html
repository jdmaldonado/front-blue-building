<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%APP_ICONS%/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%APP_ICONS%/favicon-32.png" />
    <link rel="apple-touch-icon" href="%APP_ICONS%/apple-touch-icon.png" />

    <!-- iOS ignores most of the manifest, so the app needs these to open full
         screen from the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%APP_SHORT_NAME%" />

    <meta name="theme-color" content="#E9F1F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030A11" media="(prefers-color-scheme: dark)" />
    <!-- The theme the person picked (src/app/theme.ts), applied before the first
         paint so the page never flashes in the other one. -->
    <script>
      try {
        var theme = localStorage.getItem('bb.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (error) {}
    </script>
    <title>%APP_NAME%</title>
    <!-- The splash paints before any app CSS loads, so it uses plain hex colours
         (the brand-vivid-surface token) and CSS that old phones understand. -->
    <style>
      .splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #258fb6;
        background: linear-gradient(180deg, #0b9db3, #258fb6 55%, #2d83bd);
        transition:
          opacity 0.3s,
          visibility 0s 0.3s;
      }
      .splash-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .splash-logo {
        width: 70%;
        max-width: 320px;
        height: auto;
        fill: #fff;
        animation: splash-in 0.6s ease-out both;
      }
      .splash-mark {
        position: relative;
        width: 1px;
        height: 56px;
        margin-top: 32px;
        background: #fff;
        transform: rotate(25deg);
        transform-origin: top;
        animation: splash-draw 0.6s 0.3s ease-out both;
      }
      .splash-ring {
        position: absolute;
        bottom: -8px;
        left: -4px;
        box-sizing: border-box;
        width: 9px;
        height: 9px;
        border: 1px solid #fff;
        border-radius: 50%;
        animation: splash-pulse 1.2s 0.9s ease-in-out infinite both;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }
      @keyframes splash-draw {
        from {
          transform: rotate(25deg) scaleY(0);
        }
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }
      .splash-message {
        max-width: 280px;
        margin: 32px 24px 0;
        color: #fff;
        font: 16px/1.5 sans-serif;
        text-align: center;
      }
      .splash-retry {
        position: relative;
        z-index: 0;
        min-width: 240px;
        height: 52px;
        margin-top: 24px;
        padding: 0 48px;
        border: 0;
        background: none;
        color: #06121b;
        font: 15px sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.15s;
      }
      .splash-retry::before {
        content: '';
        position: absolute;
        top: 0;
        right: 24px;
        bottom: 0;
        left: 24px;
        z-index: -1;
        background: #fafcfd;
        box-shadow: 0 10px 30px rgba(33, 100, 138, 0.55);
        transform: skewX(-25deg);
      }
      .splash-retry:hover {
        transform: translateY(-4px);
      }
      .splash-failed .splash-mark {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash,
        .splash * {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>

    <!-- Plain old JavaScript on purpose: it must run on phones too old for the app. -->
    <script>
      (function () {
        var START_TIMEOUT_MS = 15000;
        var OLD_BROWSER_TEXT =
          'Tu teléfono o navegador es muy antiguo para Blue Building. Actualízalo o usa otro dispositivo.';
        var TIMEOUT_TEXT = 'No pudimos cargar la app. Revisa tu conexión e intenta de nuevo.';
        var splash = document.getElementById('splash');
        var message = document.getElementById('splash-message');
        var retry = document.getElementById('splash-retry');

        function fail(className, text, canRetry) {
          splash.className = 'splash splash-failed ' + className;
          message.textContent = text;
          message.hidden = false;
          retry.hidden = !canRetry;
        }

        // The app styles need color-mix(), which arrived with the browsers the app supports.
        var supported = window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in oklch, red, blue)');
        if (!supported) {
          fail('splash-blocked', OLD_BROWSER_TEXT, false);
          return;
        }

        retry.onclick = function () {
          window.location.reload();
        };
        window.setTimeout(function () {
          if (splash.className.indexOf('splash-hidden') === -1) {
            fail('', TIMEOUT_TEXT, true);
          }
        }, START_TIMEOUT_MS);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
