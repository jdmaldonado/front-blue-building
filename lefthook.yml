pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,css,md,yaml,yml}'
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm exec oxlint {staged_files}
    no-enums:
      glob: '*.{ts,tsx}'
      run: |
        if grep -nE '\benum[[:space:]]+[A-Za-z_]' {staged_files}; then
          echo 'Prohibido declarar enum. Usa `const X = {...} as const` + z.enum(X).'
          exit 1
        fi

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
